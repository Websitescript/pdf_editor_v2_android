name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: PDF_Editor_Android
    steps:
      - uses: actions/checkout@v7

      - name: Unpack the project zip
        working-directory: .
        run: unzip -q PDF_Editor_Android_Project.zip

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The runner image already contains the Android SDK ($ANDROID_HOME).
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Package the web app
        run: npm run build:www

      - name: Create the Android project
        run: npx cap add android

      - name: Apply launcher icons
        run: cp -r resources/res/. android/app/src/main/res/

      - name: Add the native file plugin and "Open with" support
        run: python3 scripts/patch-android.py

      - name: Sync plugins and web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: PDF_Editor_Android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: PDF-Editor-APK
          path: PDF_Editor_Android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error